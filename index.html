<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Babylon.js - GLB Export with Camera</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #saveBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 10px 15px;
    }
  </style>
</head>
<body>
  <button id="saveBtn">💾 GLB 저장</button>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/serializers/babylon.glTF2Serializer.min.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);

      new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

      // ✅ 기존 카메라 위치 및 타겟 (당신이 쓰던 값)
      const target = new BABYLON.Vector3(-3.3249, 1.9977, -2.5460);
      const position = new BABYLON.Vector3(-2.7874, 2.4456, -1.8715);
      const direction = position.subtract(target);
      const radius = direction.length();
      const alpha = Math.atan2(direction.z, direction.x);
      const beta = Math.acos(direction.y / radius);

      // Arc 카메라
      const arcCamera = new BABYLON.ArcRotateCamera("arcCamera", alpha, beta, radius, target, scene);
      arcCamera.attachControl(canvas, true);

      await BABYLON.SceneLoader.AppendAsync("models/", "scene.gltf", scene);

      // 머티리얼 백페이스 제거
      scene.executeWhenReady(() => {
        scene.meshes.forEach(mesh => {
          if (mesh.material && "backFaceCulling" in mesh.material) {
            mesh.material.backFaceCulling = false;
          }
        });
      });

      // 저장 버튼 클릭 시 실행
      document.getElementById("saveBtn").addEventListener("click", () => {
        // ✅ ArcRotateCamera의 시점 계산해서 UniversalCamera 생성
        const exportedCamera = new BABYLON.UniversalCamera("ExportedCamera", arcCamera.position.clone(), scene);
        exportedCamera.setTarget(arcCamera.target.clone());
        exportedCamera.metadata = { gltf: { export: true } };

        // 내보내기
        BABYLON.GLTF2Export.GLBAsync(scene, "exportedScene_with_camera").then(glb => {
          glb.downloadFiles();
          console.log("📦 GLB 저장 완료 (카메라 포함)");
        });
      });

      engine.runRenderLoop(() => scene.render());
      window.addEventListener('resize', () => engine.resize());
    });
  </script>
</body>
</html>
